<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="css/style.css" rel="stylesheet">
    <style>
    svg { 
      border: 3px solid #000; 
    }
    </style>
  </head>
  <body>
    <svg width="400" height="400" viewBox="0 0 800 800" ">

      <defs >
          <radialgradient id="centerslash" cx="50%" cy="50%" role="50%">
            <stop offset="0%" stop-color="#fff"/>
            <stop offset="100%" stop-color="#000" />
          </radialgradient>
      </defs>

      <defs>
        <lineargradient id="linegrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff9a9e"/>
          <stop offset="100%" stop-color="#fad8cd" />
        </lineargradient>
      </defs>

      <circle cx="200" cy="200" r="100" fill="#f00" stroke-width="10" stroke="#ffff00"></circle>
      <rect x="50" y="50" width="100" height="100" fill="url(#linegrad)"></rect>
      <circle cx="200" cy="400" r="100" fill="#ff2200"></circle>
      <circle cx="600" cy="400" r="100" fill="url(#centerslash)"></circle>
      <polygon points="500,100 600,200 700,100 700,400 600,300 500,400 400,300 400,100" 
        fill="#00f"
        stroke-width="10" stroke="#ffff00">
      ></polygon>
      <text x="250" y="650" font-size="50" font-weight="600" fill="cyan" font-family="Monospace">Whole shift</text>
      <path d="M100, 600 L 150, 600 M 100, 620 L 150, 620 M 100, 640 L 150, 640" stroke="red" stroke-width="5"></path>
    </svg> 
      <path d="M100, 600 L 150, 600 M 100, 620 L 150, 620 M 100, 640 L 150, 640" stroke="red" stroke-width="5"></path>
  </body>
</html>
